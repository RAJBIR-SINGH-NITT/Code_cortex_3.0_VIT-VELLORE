<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Cortex | NGAV</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen font-sans">

<div class="bg-gray-800 p-10 rounded-xl shadow-2xl w-full max-w-lg text-center">
    <h1 class="text-3xl font-bold mb-2 text-blue-400">Next-Gen Antivirus</h1>
    <p class="text-gray-400 mb-8">Structural AI Anomaly Detection</p>

    <div class="border-2 border-dashed border-gray-600 rounded-lg p-6 mb-6">
        <input type="file" id="fileInput" class="hidden" accept=".exe,.dll,.bin" />
        <label for="fileInput" class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white py-2 px-4 rounded-md transition duration-300 inline-block mb-4">
            Select Executable File
        </label>
        <p id="fileName" class="text-sm text-gray-400">No file selected</p>
    </div>

    <button id="scanBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition duration-300 hidden">
        Scan for Malware
    </button>

    <div id="resultPanel" class="mt-8 hidden p-4 rounded-lg text-left">
        <h2 id="verdict" class="text-2xl font-bold mb-2 text-center"></h2>
        <div class="text-gray-300 text-sm">
            <p class="mb-1"><strong>AI Confidence:</strong> <span id="confidence"></span>%</p>
            <p><strong>Database Log ID:</strong> <span id="dbId" class="text-gray-500"></span></p>
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileName');
    const scanBtn = document.getElementById('scanBtn');
    const resultPanel = document.getElementById('resultPanel');
    const verdictText = document.getElementById('verdict');
    const confidenceText = document.getElementById('confidence');
    const dbIdText = document.getElementById('dbId');

    // Show selected file name
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            fileNameDisplay.textContent = fileInput.files[0].name;
            scanBtn.classList.remove('hidden');
            resultPanel.classList.add('hidden');
        }
    });

    // Handle File Scan
    scanBtn.addEventListener('click', async () => {
        const file = fileInput.files[0];
        if (!file) return;

        // Update UI to show loading state
        scanBtn.textContent = 'Analyzing Structural Geometry...';
        scanBtn.disabled = true;
        resultPanel.classList.add('hidden');

        const formData = new FormData();
        formData.append('file', file);

        try {
            // Call the Spring Boot backend
            const response = await fetch('/api/security/scan', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error("Server Error");
            const result = await response.json();

            // Update UI based on verdict
            if (result.status === "MALWARE DETECTED") {
                resultPanel.className = "mt-8 p-4 rounded-lg bg-red-900 border border-red-500";
                verdictText.className = "text-2xl font-bold mb-2 text-center text-red-400";
            } else {
                resultPanel.className = "mt-8 p-4 rounded-lg bg-green-900 border border-green-500";
                verdictText.className = "text-2xl font-bold mb-2 text-center text-green-400";
            }

            verdictText.textContent = result.status;
            confidenceText.textContent = (result.confidenceScore * 100).toFixed(2);
            dbIdText.textContent = result.id;

            resultPanel.classList.remove('hidden');

        } catch (error) {
            alert('Error scanning file. Make sure both Spring Boot and Python servers are running.');
        } finally {
            scanBtn.textContent = 'Scan for Malware';
            scanBtn.disabled = false;
        }
    });
</script>
</body>
</html>
